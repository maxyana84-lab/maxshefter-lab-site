name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build info and contact email
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
          sed -i \
            -e "s|__BUILD_SHA__|${SHORT_SHA}|g" \
            -e "s|__BUILD_TIME__|${BUILD_TIME}|g" \
            -e "s|__CONTACT_EMAIL__|${CONTACT_EMAIL:-__CONTACT_EMAIL__}|g" \
            site/index.html

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split('.')[1]; p += '=' * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: d.get(k) for k in ['iss','aud','sub','repository','ref','environment']}, indent=2))
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::292960608922:role/github-deploy-maxshefter-lab-site
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          # HTML: always revalidate so updates show up immediately
          aws s3 sync site/ "s3://maxshefter-lab.online" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"
          # Everything else (images, pdf, css): cache for a day
          aws s3 sync site/ "s3://maxshefter-lab.online" --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "E1ZBP6P5QVDD0B" \
            --paths "/*"

      - name: Smoke test
        run: |
          sleep 20
          curl -fsS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://maxshefter-lab.online/
